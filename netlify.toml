[build]
  publish = "public"
  command = ""

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Client space for orders: /commande/RQ-XXXXX?t=…
[[redirects]]
  from = "/commande/*"
  to = "/commande/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/studio/*"
  [headers.values]
    X-Robots-Tag = "noindex"
