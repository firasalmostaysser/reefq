[build]
  publish = "public"
  command = ""
  # Deploys cost Netlify credits: skip a deploy when a push only changes docs, tests or tools (exit 0 = skip)
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- public netlify netlify.toml package.json"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Client space for orders: /commande/RQ-XXXXX?t=…
[[redirects]]
  from = "/commande/*"
  to = "/commande/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/studio/*"
  [headers.values]
    X-Robots-Tag = "noindex"
