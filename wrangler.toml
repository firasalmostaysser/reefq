name = "reefq"
main = "src/index.js"
compatibility_date = "2026-09-01"

# Static site: landing (/), studio (/studio/), invitation viewer (/i/…), assets
[assets]
directory = "./public"
binding = "ASSETS"
html_handling = "auto-trailing-slash"
not_found_handling = "404-page"
run_worker_first = ["/api/*", "/i/*", "/templates.json", "/media/*", "/auth/*"]

[[d1_databases]]
binding = "DB"
database_name = "reefq"
database_id = "PASTE_D1_DATABASE_ID"
migrations_dir = "migrations"

[[kv_namespaces]]
binding = "STATE"
id = "PASTE_KV_NAMESPACE_ID"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "reefq-media"

# Canva folder sync every 15 minutes
[triggers]
crons = ["*/15 * * * *"]

[vars]
SITE_URL = "https://reefq.com"
CANVA_FOLDER_ID = ""
MAX_EXPORTS_PER_RUN = "8"

# Secrets (npx wrangler secret put NAME):
#   STUDIO_PASSWORD      password for /studio
#   SESSION_SECRET       long random string used to sign studio sessions
#   CANVA_CLIENT_ID      Canva Connect integration (optional)
#   CANVA_CLIENT_SECRET
#   ANTHROPIC_API_KEY    enables "Write it with Claude" in the studio (optional)
